<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="這是一個專為皮克敏 Bloom 玩家打造的明信片圖鑑系統，方便玩家收藏與分享各大花朵與蘑菇戰明信片。">
  <meta property="og:title" content="皮克敏 Bloom 明信片圖鑑系統">
  <meta property="og:description" content="收藏與分享您的皮克敏 Bloom 明信片，記錄每一個冒險足跡。">
  <meta property="og:url" content="https://pikmin.tech">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Pikmin Bloom Postcard Gallery</title>
  <style>/*CSS*/</style>
  <!-- Start the API request right away (in parallel with the JS download) and
       preload the first images as soon as their addresses are known. -->
  <script>
  (function () {
    try {
      var p = fetch('/api/postcards?limit=30&skip=0').then(function (r) {
        if (!r.ok) throw 0;
        return r.json();
      });
      p.then(function (d) {
        d.slice(0, 4).forEach(function (c, i) {
          var u = c.thumb || c.image;
          if (!u) return;
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = u;
          if (i === 0) l.fetchPriority = 'high';
          document.head.appendChild(l);
        });
      }).catch(function () {});
      window.__pcPromise = p;
    } catch (e) {}
  })();
  </script>
  <script type="module" src="assets/app.__HASH__.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">
  <div id="app" class="flex-1 flex flex-col">
    <!-- placeholder with the same height as the real header; replaced when the app starts -->
    <div class="h-16 bg-white border-b border-slate-200"></div>
  </div>
</body>
</html>
