<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikmin Bloom Postcard Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0e9fe',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂端導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-brand-600 rounded-lg flex items-center justify-center text-white font-semibold">
                    PB
                </div>
                <h1 id="navTitle" class="text-xl font-bold tracking-tight text-slate-900">Pikmin Bloom Postcards</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <!-- 語言切換按鈕 -->
                <button onclick="toggleLanguage()" id="langBtn" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition-colors border border-slate-300">
                    EN / 繁體中文
                </button>
                <button onclick="openUploadModal()" id="uploadBtnText" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                    Upload Postcard
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- 搜尋與篩選列 -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
            <div class="w-full sm:w-72">
                <input type="text" id="searchInput" oninput="filterPostcards()" placeholder="Search postcards..." class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-transparent">
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto pb-2 sm:pb-0">
                <button onclick="setFilter('all')" class="filter-tab px-4 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white transition-colors" data-filter="all">All</button>
                <button onclick="setFilter('Flower')" class="filter-tab px-4 py-2 text-sm font-medium rounded-lg bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 transition-colors" data-filter="Flower">Flower</button>
                <button onclick="setFilter('Mushroom Fight')" class="filter-tab px-4 py-2 text-sm font-medium rounded-lg bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 transition-colors" data-filter="Mushroom Fight">Mushroom Fight</button>
            </div>
        </div>

        <!-- 明信片網格 -->
        <div id="postcardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 動態載入 -->
        </div>

        <!-- 空白狀態提示 -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200 shadow-sm mt-4">
            <p id="emptyText" class="text-slate-500 text-sm">No postcards found. Upload your first postcard!</p>
        </div>
    </main>

    <!-- 上傳彈跳視窗 (Modal) -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative border border-slate-200 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitleText" class="text-lg font-bold text-slate-900">Upload New Postcard</h3>
                <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label id="labelTitle" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Postcard Title</label>
                    <input type="text" id="postTitle" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                </div>

                <div>
                    <label id="labelSource" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Source Type</label>
                    <select id="postSourceType" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                        <option value="Flower">Flower (花朵)</option>
                        <option value="Mushroom Fight">Mushroom Fight (蘑菇戰鬥)</option>
                    </select>
                </div>

                <div>
                    <label id="labelAddress" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Location Address</label>
                    <input type="text" id="postAddress" required placeholder="e.g., Taipei 101, No. 7, Section 5, Xinyi Road" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                </div>

                <div>
                    <label id="labelDate" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Date Collected</label>
                    <input type="date" id="postDate" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                </div>

                <div>
                    <label id="labelImage" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Image (PNG / JPEG)</label>
                    <input type="file" id="postImageFile" accept="image/png, image/jpeg" onchange="previewImage(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                    <input type="text" id="postImageUrl" placeholder="Or paste image URL..." oninput="previewUrlImage()" class="w-full mt-2 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                </div>

                <!-- 即時圖片預覽區 -->
                <div id="imagePreviewContainer" class="hidden mt-2">
                    <p class="text-xs font-medium text-slate-500 mb-1">Preview:</p>
                    <img id="imagePreviewElement" src="" alt="Preview" class="w-full h-40 object-cover rounded-lg border border-slate-200">
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeUploadModal()" id="cancelBtnText" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                    <button type="submit" id="submitBtnText" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700">Upload</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 詳細檢視 Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full overflow-hidden border border-slate-200">
            <img id="detailImage" src="" alt="" class="w-full h-64 object-cover">
            <div class="p-6 space-y-3">
                <div class="flex justify-between items-start">
                    <h3 id="detailTitle" class="text-xl font-bold text-slate-900"></h3>
                    <span id="detailSource" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-brand-50 text-brand-700 border border-brand-100"></span>
                </div>
                <p id="detailAddress" class="text-sm text-slate-600 flex items-center gap-1"></p>
                <p id="detailDate" class="text-xs text-slate-400"></p>
                <div class="flex justify-end pt-4 border-t border-slate-100">
                    <button onclick="closeDetailModal()" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-900">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let postcards = [];
        let currentFilter = 'all';
        let previewBase64 = '';

        const translations = {
            en: {
                navTitle: "Pikmin Bloom Postcards",
                uploadBtnText: "Upload Postcard",
                searchInputPlaceholder: "Search postcards...",
                all: "All",
                flower: "Flower",
                mushroom: "Mushroom Fight",
                emptyText: "No postcards found. Upload your first postcard!",
                modalTitleText: "Upload New Postcard",
                labelTitle: "Postcard Title",
                labelSource: "Source Type",
                labelAddress: "Location Address",
                labelDate: "Date Collected",
                labelImage: "Image (PNG / JPEG)",
                cancelBtnText: "Cancel",
                submitBtnText: "Upload",
                flowerBadge: "Flower",
                mushroomBadge: "Mushroom Fight"
            },
            zh: {
                navTitle: "Pikmin Bloom 明信片圖庫",
                uploadBtnText: "上傳明信片",
                searchInputPlaceholder: "搜尋明信片...",
                all: "全部",
                flower: "花朵",
                mushroom: "蘑菇戰鬥",
                emptyText: "目前沒有明信片，請點擊上方上傳您的第一張明信片！",
                modalTitleText: "上傳新明信片",
                labelTitle: "明信片標題",
                labelSource: "來源類型",
                labelAddress: "詳細地址",
                labelDate: "收集日期",
                labelImage: "圖片檔案 (PNG / JPEG)",
                cancelBtnText: "取消",
                submitBtnText: "確認上傳",
                flowerBadge: "花朵",
                mushroomBadge: "蘑菇戰鬥"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            updateStaticTexts();
            renderPostcards();
        }

        function updateStaticTexts() {
            const t = translations[currentLang];
            document.getElementById('navTitle').innerText = t.navTitle;
            document.getElementById('uploadBtnText').innerText = t.uploadBtnText;
            document.getElementById('searchInput').placeholder = t.searchInputPlaceholder;
            document.getElementById('emptyText').innerText = t.emptyText;
            document.getElementById('modalTitleText').innerText = t.modalTitleText;
            document.getElementById('labelTitle').innerText = t.labelTitle;
            document.getElementById('labelSource').innerText = t.labelSource;
            document.getElementById('labelAddress').innerText = t.labelAddress;
            document.getElementById('labelDate').innerText = t.labelDate;
            document.getElementById('labelImage').innerText = t.labelImage;
            document.getElementById('cancelBtnText').innerText = t.cancelBtnText;
            document.getElementById('submitBtnText').innerText = t.submitBtnText;
            
            // 更新篩選標籤
            document.querySelector('[data-filter="all"]').innerText = t.all;
            document.querySelector('[data-filter="Flower"]').innerText = t.flower;
            document.querySelector('[data-filter="Mushroom Fight"]').innerText = t.mushroom;
        }

        // 從後端 API 取得明信片
        async function fetchPostcards() {
            try {
                const response = await fetch('/api/postcards');
                if (response.ok) {
                    postcards = await response.json();
                    renderPostcards();
                }
            } catch (err) {
                console.error('無法連線至伺服器讀取資料:', err);
            }
        }

        function renderPostcards() {
            const grid = document.getElementById('postcardGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = postcards.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.sourceType === currentFilter;
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || item.address.toLowerCase().includes(searchTerm);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow cursor-pointer flex flex-col';
                card.onclick = () => openDetailModal(item);

                const badgeText = currentLang === 'zh' ? (item.sourceType === 'Flower' ? '花朵' : '蘑菇戰鬥') : item.sourceType;

                card.innerHTML = `
                    <img src="${item.image}" alt="${item.title}" class="w-full h-48 object-cover">
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <h3 class="font-bold text-slate-900 truncate">${item.title}</h3>
                                <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-brand-50 text-brand-700 border border-brand-100">${badgeText}</span>
                            </div>
                            <p class="text-xs text-slate-500 line-clamp-1 mb-2">${item.address}</p>
                        </div>
                        <p class="text-xs text-slate-400">${item.date}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                if (btn.getAttribute('data-filter') === filter) {
                    btn.className = "filter-tab px-4 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white transition-colors";
                } else {
                    btn.className = "filter-tab px-4 py-2 text-sm font-medium rounded-lg bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 transition-colors";
                }
            });
            renderPostcards();
        }

        function filterPostcards() {
            renderPostcards();
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadForm').reset();
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            previewBase64 = '';
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
        }

        // 圖片檔案即時預覽
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewBase64 = e.target.result;
                    const previewElem = document.getElementById('imagePreviewElement');
                    previewElem.src = previewBase64;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('postImageUrl').value = ''; // 清空網址欄
                };
                reader.readAsDataURL(file);
            }
        }

        // 網址圖片即時預覽
        function previewUrlImage() {
            const url = document.getElementById('postImageUrl').value.trim();
            if (url) {
                previewBase64 = url;
                const previewElem = document.getElementById('imagePreviewElement');
                previewElem.src = url;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
                document.getElementById('postImageFile').value = ''; // 清空檔案選擇
            } else {
                document.getElementById('imagePreviewContainer').classList.add('hidden');
            }
        }

        async function handleUpload(event) {
            event.preventDefault();
            const title = document.getElementById('postTitle').value;
            const sourceType = document.getElementById('postSourceType').value;
            const address = document.getElementById('postAddress').value;
            const date = document.getElementById('postDate').value;
            const image = previewBase64 || document.getElementById('postImageUrl').value;

            if (!image) {
                alert('Please select an image file or provide an image URL.');
                return;
            }

            const newPostcard = { title, sourceType, address, date, image };

            try {
                const response = await fetch('/api/postcards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newPostcard)
                });

                if (response.ok) {
                    const saved = await response.json();
                    postcards.unshift(saved);
                    renderPostcards();
                    closeUploadModal();
                } else {
                    alert('Failed to save postcard to database.');
                }
            } catch (err) {
                console.error('伺服器連線失敗:', err);
                alert('Error connecting to server.');
            }
        }

        function openDetailModal(item) {
            document.getElementById('detailImage').src = item.image;
            document.getElementById('detailTitle').innerText = item.title;
            const badgeText = currentLang === 'zh' ? (item.sourceType === 'Flower' ? '花朵' : '蘑菇戰鬥') : item.sourceType;
            document.getElementById('detailSource').innerText = badgeText;
            document.getElementById('detailAddress').innerText = item.address;
            document.getElementById('detailDate').innerText = item.date;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // 初始化載入
        fetchPostcards();
    </script>
</body>
</html>
